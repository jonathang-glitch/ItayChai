name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_APP_URL: postgresql://itay_chai_app:app@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit --audit-level=high
      - run: docker build -f apps/api/Dockerfile -t itay-chai-api:${{ github.sha }} .
      - run: docker build -f apps/worker/Dockerfile -t itay-chai-worker:${{ github.sha }} .
      - run: docker build -f apps/outbox-relay/Dockerfile -t itay-chai-outbox-relay:${{ github.sha }} .

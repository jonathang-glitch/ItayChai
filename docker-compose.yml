services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data

  # Keeps the test queue off the dev queue, so a running worker cannot claim test jobs.
  redis-test:
    image: redis:7-alpine
    ports:
      - '6380:6379'

volumes:
  redis-data:
